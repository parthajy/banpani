# /etc/nginx/sites-available/banpani
# Proxies everything to the Node server (which serves both the API and the static site).
# certbot will add the TLS lines automatically on first run.

limit_req_zone $binary_remote_addr zone=banpani_write:10m rate=30r/m;

server {
    listen 80;
    server_name banpani.org www.banpani.org;

    # light rate-limit on writes to blunt spam; reads are unlimited
    location ~ ^/api/(reports|routes|collection-points|ngos|volunteers) {
        limit_req zone=banpani_write burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
