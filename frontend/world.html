<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Banpani — Live world disaster map (beta)</title>
  <meta name="description" content="A live, community-run world map of disasters — floods, fires and more. No accounts, no login. Open source, owned by everyone." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0f1419" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VHTJ828EM6"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-VHTJ828EM6');</script>
  <style>
    #wmap{flex:1;min-height:0;background:#0b0f14;z-index:1}
    #wsearchbox{top:60px}
    #wfilters{position:absolute;top:108px;left:10px;right:10px;z-index:600;display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    #wfilters::-webkit-scrollbar{display:none}
    .wchip{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:20px;
      padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;opacity:.55}
    .wchip::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--c)}
    .wchip.on{color:var(--text);border-color:var(--c);opacity:1}
    .wbeta{position:absolute;left:10px;right:10px;bottom:10px;z-index:600;background:var(--panel);border:1px solid var(--line);
      border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow);line-height:1.5}
    .wbeta a{color:var(--accent);font-weight:600}
    .wcount{color:var(--text);font-weight:700}
    @media(max-width:860px){ #wfilters{top:104px} .wbeta{font-size:11.5px} }
    /* report-from-anywhere */
    .wfab{position:absolute;right:16px;bottom:74px;z-index:650;background:var(--accent);color:#fff;border:none;border-radius:26px;
      padding:13px 18px;font-size:15px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer}
    .wfab:active{transform:scale(.95)}
    .whint{position:absolute;top:150px;left:50%;transform:translateX(-50%);z-index:640;background:var(--accent);color:#fff;
      padding:8px 15px;border-radius:20px;font-size:13px;font-weight:600;display:none;box-shadow:var(--shadow)}
    .whint.show{display:block}
    .wreport{position:fixed;left:0;right:0;bottom:0;z-index:1000;max-width:520px;margin:0 auto;background:var(--panel);
      border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 34px rgba(0,0,0,.5);
      padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(115%);transition:transform .34s cubic-bezier(.32,.72,0,1)}
    .wreport.show{transform:translateY(0)}
    .wr-title{font-weight:700;margin-bottom:10px;font-size:15px}
    .wr-fam{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .wr-fam button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:18px;
      padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
    .wr-fam button::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--c)}
    .wr-fam button.on{color:var(--text);border-color:var(--c)}
    .wreport input,.wreport textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
      border-radius:10px;padding:12px;margin-bottom:10px;font-size:16px;font-family:inherit}
    .wr-actions{display:flex;gap:8px}
    .wr-actions .btn{flex:1;margin:0}
    .wtoast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2000;background:#1c2530;color:#fff;
      padding:10px 16px;border-radius:22px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}
    .wtoast.show{opacity:1}
  </style>
</head>
<body>
  <header>
    <img class="logo" src="icon.svg" alt="Banpani" width="28" height="28" />
    <div><h1>Banpani <span style="color:var(--muted);font-weight:400;font-size:13px">· World map</span></h1></div>
    <div class="spacer"></div>
    <a class="link" href="/">🆘 Assam relief map</a>
    <a class="link" href="/about.html">ℹ️ About</a>
  </header>

  <div id="wmap"></div>

  <div class="searchbox" id="wsearchbox">
    <input id="wsearch" type="search" autocomplete="off" placeholder="Search any place on Earth…" />
    <div class="searchresults" id="wresults"></div>
  </div>

  <div id="wfilters"></div>

  <div class="wbeta" id="wbeta">
    🌍 <b>Beta.</b> <span class="wcount" id="wc">…</span> markers. Solid dots = <b>community reports</b>; dashed rings = <b>official alerts</b> (GDACS).
    Report a disaster anywhere — no accounts. <a href="/">Assam relief map →</a>
  </div>

  <button class="wfab" id="wreportBtn">＋ Report</button>
  <div class="whint" id="whint">Tap the map where it’s happening 📍</div>

  <div class="wreport" id="wreportPanel">
    <div class="wr-title">Report a disaster here</div>
    <div class="wr-fam" id="wr_fam"></div>
    <input id="wr_place" maxlength="80" placeholder="Place name (village, town, area)" />
    <textarea id="wr_details" rows="2" maxlength="600" placeholder="What’s happening / what’s needed? (optional)"></textarea>
    <div class="wr-actions">
      <button class="btn" id="wr_submit">Post to the map</button>
      <button class="btn ghost" id="wr_cancel">Cancel</button>
    </div>
  </div>

  <div class="wtoast" id="wtoast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="world.js"></script>
</body>
</html>
